# ┌─────────────────────────────────────────────────────────┐
# │                   Spawn Settings                        │
# └─────────────────────────────────────────────────────────┘

# The world whose spawn is used for join-location: spawn and the /spawn command.
# Leave empty to always use the server's default world (recommended).
# On multiworld servers, set this to prevent players in the nether/end being
# sent to those worlds' spawns instead of your main world's spawn.
spawn-world: ""

# Where should players be sent when they join the server?
#   last-location - Players join where they left off (default Minecraft behaviour)
#   spawn         - Players are always teleported to world spawn on join
join-location: last-location

# Show a countdown when a player uses /spawn.
# If the player moves during the countdown, the teleport is cancelled.
# Set to false to teleport instantly.
spawn-countdown: true

# Duration of the /spawn countdown in seconds. Only applies if spawn-countdown is true.
spawn-countdown-seconds: 3

# ┌─────────────────────────────────────────────────────────┐
# │                    Kick Settings                        │
# └─────────────────────────────────────────────────────────┘

# Should the server announce in chat when a player is kicked?
announce-kick: true

# ┌─────────────────────────────────────────────────────────┐
# │                     Ban Settings                        │
# └─────────────────────────────────────────────────────────┘

# Should the server announce in chat when a player is banned?
announce-ban: true

# Should the server announce in chat when a player is unbanned?
announce-unban: true

# Should the server announce in chat when an IP is banned?
# The announcement shows the player's name, not their IP address.
announce-banip: true

# The link shown on the ban screen for players to appeal their ban.
# Set to "" to hide the appeal line entirely.
ban-appeal-link: "https://discord.gg/yourlink"

# ┌─────────────────────────────────────────────────────────┐
# │                    Mute Settings                        │
# └─────────────────────────────────────────────────────────┘

# Should the server announce in chat when a player is muted?
announce-mute: true

# Should the server announce in chat when a player is unmuted?
announce-unmute: true

# Commands that muted players are blocked from using.
# Add any commands that allow communication (e.g. msg, reply, tell, me).
# Do NOT include the "/" prefix.
mute-blocked-commands:
  - msg
  - tell
  - whisper
  - w
  - reply
  - r
  - me
  - mail

# ┌─────────────────────────────────────────────────────────┐
# │                  Slowchat Settings                      │
# └─────────────────────────────────────────────────────────┘

# Default slowchat cooldown in seconds when /slowchat is used without arguments.
slowchat-default-seconds: 5

# ┌─────────────────────────────────────────────────────────┐
# │                 Messaging Settings                      │
# └─────────────────────────────────────────────────────────┘

# The format used for /msg sent/received messages.
# Configured in messages.yml.

# ┌─────────────────────────────────────────────────────────┐
# │                 Social Media Links                      │
# └─────────────────────────────────────────────────────────┘
#
# Set URLs for social media commands. Players can use /discord, /website, /store
# to see these links. Set to "" to disable a specific command.

social-links:
  discord: "https://discord.gg/yourlink"
  website: "https://yourwebsite.com"
  store: "https://yourstore.com"

# ┌─────────────────────────────────────────────────────────┐
# │                    Warn Settings                        │
# └─────────────────────────────────────────────────────────┘

# Should the server announce in chat when a player is warned?
announce-warn: true

# Automatic punishments triggered when a player reaches a certain number of warnings.
#
# Supported actions:
#   kick    - Kicks the player with the given reason
#   mute    - Mutes the player (prevents chatting)
#   tempban - Temporarily bans the player (requires a "duration" field, e.g. "1d", "12h", "30m")
#   ban     - Permanently bans the player
#   freeze  - Freezes the player (add a "duration", e.g. "10m", to make it a temp freeze)
#
# Keys can be an exact warn count ("5"), a range ("1-10") or an open range ("10+").
# An exact key always wins over a range; otherwise the first matching range is used.
# Example:
#   "1-10":
#     action: kick
#     reason: "ᴄʜᴇᴀᴛ ᴅᴇᴛᴇᴄᴛᴇᴅ. ʏᴏᴜ ɢᴏᴛ ᴀ ᴡᴀʀɴɪɴɢ!"
#   "2":
#     action: freeze
#     duration: "5m"
#     reason: "Wait for a staff member."
#
# Add or remove thresholds as needed. Set to {} to disable all auto-punishments.

warn-punishments:
  3:
    action: kick
    reason: "You have accumulated 3 warnings."
  5:
    action: mute
    reason: "You have accumulated 5 warnings."
  7:
    action: tempban
    duration: "1d"
    reason: "You have accumulated 7 warnings."
  10:
    action: ban
    reason: "You have accumulated 10 warnings."

# ┌─────────────────────────────────────────────────────────┐
# │                     TPA Settings                        │
# └─────────────────────────────────────────────────────────┘

# Show a countdown title on screen when a TPA request is accepted.
# Set to false to only use chat messages.
tpa-title-countdown: true

# Duration of the TPA teleport countdown in seconds.
tpa-countdown-seconds: 3

# ┌─────────────────────────────────────────────────────────┐
# │                   InvSee Settings                       │
# └─────────────────────────────────────────────────────────┘

# When true, players viewing another player's inventory via /invsee cannot
# move, take, or modify any items. Set to false to allow full interaction.
invsee-read-only: true

# ┌─────────────────────────────────────────────────────────┐
# │                   Vanish Settings                       │
# └─────────────────────────────────────────────────────────┘

# Broadcast a fake quit message to non-staff when a player vanishes,
# and a fake join message when they unvanish — making it look like they disconnected.
vanish-fake-join-quit: true

# Show a ghost/transparent effect (spectator appearance) to staff with
# the Axentra.vanish.see permission. Requires NMS reflection at runtime.
# Disable this if you experience issues with your server version.
vanish-ghost-effect: true

# Apply night vision to the vanished player so they can see in dark areas.
vanish-night-vision: true

# Prevent the vanished player from taking any damage.
vanish-god-mode: true

# Prevent the vanished player from picking up items.
vanish-no-pickup: true

# Show a persistent action bar reminder to the vanished player.
vanish-action-bar: true

# How often the action bar reminder is shown, in ticks (20 ticks = 1 second).
vanish-action-bar-interval: 40

# ┌─────────────────────────────────────────────────────────┐
# │               Staff Management Settings                 │
# └─────────────────────────────────────────────────────────┘

# Cooldown in seconds between /report commands per player.
report-cooldown-seconds: 60

# ┌─────────────────────────────────────────────────────────┐
# │                   General Settings                      │
# └─────────────────────────────────────────────────────────┘

# Show info messages in the console (startup banner, DB connected, config migrations).
# Error messages are always shown regardless of this setting.
# Set to false to reduce console spam and disk writes.
verbose-logging: true

# ┌─────────────────────────────────────────────────────────┐
# │                  Module Toggles                         │
# └─────────────────────────────────────────────────────────┘
#
# Enable or disable entire features/commands.
# When a module is disabled:
#   - Its commands are fully unregistered (players see "Unknown command")
#   - Its listeners are not registered (zero performance overhead)
#   - No other plugin can intercept or show usage for these commands
#
# Requires a server restart (not just /axentra reload) to take effect.

enabled-modules:
  # ── Teleportation ──

  # /tpa, /tpaccept, /tpdeny, /tpacancel, /tptoggle — player-to-player teleport requests
  tpa: true
  # /spawn, /setspawn — teleport to world spawn
  spawn: true
  # /back — return to previous location after teleport or death
  back: true

  # ── Chat & Messaging ──

  # /msg, /reply, /msgtoggle — private messages between players
  messaging: true
  # Disable this if you use another chat plugin (e.g. EssentialsChat, ChatControl).
  # When false, Axentra will NOT listen to chat events at all — mutechat, slowchat,
  # staffchat toggle, and chat history for cases will be disabled.
  # Mute enforcement and mute-blocked-commands will still work independently.
  # Commands: /clearchat, /mutechat, /slowchat, /staffchat
  chat-management: true
  # /nick, /realname, /me — set display names and action messages
  nickname: true
  # /discord, /website, /store — show your server's social media links
  social-commands: true

  # ── Player Utilities ──

  # A collection of admin/player convenience commands:
  #   /fly        — toggle flight mode for yourself or others
  #   /heal       — restore health to full
  #   /feed       — restore hunger to full
  #   /god        — toggle invincibility (no damage)
  #   /speed      — set walk or fly speed (1-10)
  #   /gamemode   — change gamemode (also /gm, /gms, /gmc, /gma, /gmsp)
  #   /clear      — clear a player's inventory
  #   /repair     — repair the item in your hand
  #   /hat        — place held item on your head as a helmet
  #   /suicide    — kill yourself
  #   /ping       — check your or another player's latency
  player-utilities: true
  # /vanish — become invisible to other players (staff feature)
  vanish: true
  # /invsee — view another player's inventory
  # /enderchestsee — view another player's ender chest
  invsee: true

  # ── World Utilities ──

  # Opens virtual workstation GUIs without needing to place blocks:
  #   /anvil, /workbench, /cartography, /grindstone,
  #   /loom, /smithingtable, /stonecutter, /enderchest
  workbench-commands: true
  # /weather (clear/rain/storm), /sun, /rain, /storm
  # /time (set/add), /day, /night, /noon, /midnight
  weather-time: true

  # ── Staff Management ──

  # /duty — toggle on/off duty status (tracks staff activity time)
  # /staffmode — enter staff mode with special tools
  # /report — let players report others to staff
  # /reports — view and manage open reports
  # /staffstats — view staff activity statistics
  # /stafflist — view online staff and duty status
  staff-management: true

  # ── Protection & Tracking ──
  # These modules add database tracking. Disable any you don't need
  # to save disk space and reduce database writes.

  # Saves a copy of player inventories on death/join/quit/world-change/clear.
  # Allows staff to view and restore inventories with /restoreinv.
  # Configure triggers in protection.yml. Disable to save disk space.
  snapshots: true
  # Tracks playtime and auto-assigns trust levels (NEW -> MEMBER -> TRUSTED).
  # Used for chat restrictions on new players. Configure in protection.yml.
  trust: true
  # Detects alt accounts by tracking shared IP addresses.
  # Shows staff alerts on join if a player has alts. Command: /alts
  alts: true
  # VPN/proxy detection via proxycheck.io API.
  # Requires an API key in protection.yml. No commands — runs on join.
  vpn: true
  # /freeze, /unfreeze — prevent a player from moving/interacting.
  # Used during investigations. Configure in protection.yml.
  freeze: true
  # /timeline — view a player's activity log (joins, punishments, trust changes).
  # Requires session tracking (at least one of: snapshots, trust, alts, or timeline enabled).
  timeline: true
  # /sethome, /home, /delhome, /homes — player home system
  homes: true
  # Staff teleport commands: /tp, /tphere, /tpall, /tpahere, /top
  teleport: true

  # ── Server Health ──

  # /lag — TPS overview, chunk analysis, entity breakdown, history.
  # Includes TPS/MSPT measurement and TPS history recording.
  lag: true
  # Health score calculation (0-100 composite of TPS, MSPT, memory, entities).
  health-score: true
  # Staff alerts when TPS drops below threshold for too long.
  alerts: true
  # Automatic ground-item cleanup (interval or on TPS alert).
  # /lag clear [items|mobs|all]
  cleanup: true
  # Per-chunk entity limits. Blocks spawns when exceeded.
  entity-limits: true
  # /restart — scheduled and manual server restarts with countdown.
  restarts: true
  # /maintenance — lock server for staff-only access.
  maintenance: true
  # /setwarp, /delwarp, /warp, /warps, /editwarp — server warp points.
  warps: true
  # /rtp — random teleport to a safe location in the wild.
  rtp: true

  # ── Discord (v1.9.0) ──

  # Discord bot: account linking, role sync, case/report/alert channels, slash commands,
  # ban appeals and the weekly report. The bot itself is off until you set enabled: true
  # and a token in discord.yml.
  discord: true

  # ── Player Info (v1.9.0) ──

  # /afk and automatic AFK. AFK time doesn't count as playtime or for trust.
  afk: true
  # /seen — when a player was last online
  seen: true
  # /whois — everything about a player
  whois: true
  # /near — players near you
  near: true
  # /list — online players by group (replaces the vanilla /list while on)
  list: true

# ┌─────────────────────────────────────────────────────────┐
# │                    Homes Settings                       │
# └─────────────────────────────────────────────────────────┘

homes:
  # Default max homes per player (override with Axentra.homes.<n> permission)
  default-limit: 3
  # Delay in seconds before teleporting to a home (0 = instant)
  teleport-delay: 3
  # Worlds where /sethome is not allowed
  blacklisted-worlds: []

# ┌─────────────────────────────────────────────────────────┐
# │                    Warp Settings                       │
# └─────────────────────────────────────────────────────────┘

warps:
  # Default icon in the /warps GUI (Material name)
  default-icon: "ENDER_PEARL"
  # Delay in seconds before teleporting to a warp (0 = instant)
  teleport-delay: 3

# ┌─────────────────────────────────────────────────────────┐
# │                     RTP Settings                        │
# └─────────────────────────────────────────────────────────┘

rtp:
  # Cooldown in seconds between /rtp uses per player.
  cooldown-seconds: 300
  # Delay in seconds before teleporting (0 = instant).
  teleport-delay: 5
  # Per-world RTP configuration.
  worlds:
    world:
      enabled: true
      min-radius: 500
      max-radius: 10000
      center-x: 0
      center-z: 0
    world_nether:
      enabled: true
      min-radius: 100
      max-radius: 3000
      center-x: 0
      center-z: 0
      max-y: 120
    world_the_end:
      enabled: false

# ┌─────────────────────────────────────────────────────────┐
# │                     AFK Settings                        │
# └─────────────────────────────────────────────────────────┘

afk:
  # Minutes without moving, chatting or interacting before a player is AFK (0 = never automatic).
  auto-afk-minutes: 3
  # Kick players who are AFK this long (0 = never). Bypass: Axentra.afk.kickbypass
  kick-minutes: 5
  # Tell everyone when someone goes AFK or comes back. When false, only the player sees it.
  broadcast: true
  # Tag in front of the name in the tab list. Empty = no tag.
  tag-format: "&7[AFK] "
  # Moving while in water or in a vehicle doesn't count as activity (stops AFK pools and minecart loops).
  ignore-water-movement: true
  ignore-vehicle-movement: true

# ┌─────────────────────────────────────────────────────────┐
# │                     Near & List                         │
# └─────────────────────────────────────────────────────────┘

near:
  # Radius when none is given.
  default-radius: 100
  # Largest radius. Players with Axentra.near.radius.<n> may use up to <n> instead.
  max-radius: 500

list:
  # Groups in /list and the Discord /online, top to bottom. A player is in the first group whose
  # permission Axentra.list.group.<name> they have. Values are the display names.
  # Note: ops have every permission, so they show up in the first group.
  groups:
    owner: "&4Owner"
    admin: "&cAdmin"
    moderator: "&2Moderator"
    helper: "&aHelper"
    vip: "&6VIP"
  # Group for everyone else.
  default-group: "&7Players"

# ══════════════════════════════════════════════════════════
#                     End of Config
