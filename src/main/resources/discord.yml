#
# ┌─────────────────────────────────────────────────────────┐
# │                Axentra Discord Config                   │
# │                  Made by OlliesWorld                    │
# └─────────────────────────────────────────────────────────┘
#
#  This file configures the Discord integration (v1.9.0).
#  Axentra works fine without Discord: the bot is off by default.
#  After making changes, use /axentra reload to apply them.
#
#  Quick setup:
#   1. Go to https://discord.com/developers/applications and create an application.
#   2. Open "Bot", click "Reset Token" and paste the token below. Never share it.
#   3. On the same "Bot" page, turn on these Privileged Gateway Intents:
#        - SERVER MEMBERS INTENT   (instant role updates from Discord to Minecraft)
#        - MESSAGE CONTENT INTENT  (staff chat from Discord to Minecraft)
#      Without them Axentra still starts: Discord staff chat is off, and role changes made
#      in Discord are only picked up by the periodic role sync.
#   4. Open "OAuth2" > "URL Generator", tick the scopes "bot" and "applications.commands",
#      and give the bot: View Channels, Send Messages, Embed Links, Attach Files,
#      Read Message History, Manage Messages, Create Public Threads, Manage Webhooks,
#      Manage Roles and Manage Nicknames. Open the URL and invite the bot.
#   5. In Discord, turn on Developer Mode (User Settings > Advanced), then right-click
#      your server and channels and use "Copy ID" to fill in the IDs below.
#
# ══════════════════════════════════════════════════════════

# Turn the bot on or off. Also needs "discord: true" under enabled-modules in config.yml.
enabled: false

# Your bot token from the Developer Portal. Never share this — anyone with it controls your bot.
token: ""

# The ID of your Discord server (right-click the server icon > Copy ID).
guild-id: ""

# Your server's name, shown in embed footers and DMs ({server}).
server-name: "Minecraft"

# ┌─────────────────────────────────────────────────────────┐
# │                      Bot Status                         │
# └─────────────────────────────────────────────────────────┘

status:
  # PLAYING, WATCHING or LISTENING
  type: WATCHING
  # Placeholders: {online}, {max}. Updated every minute.
  text: "{online}/{max} players"

# ┌─────────────────────────────────────────────────────────┐
# │                       Channels                          │
# └─────────────────────────────────────────────────────────┘

# Channel IDs (right-click a channel > Copy ID). Leave an ID empty to turn that channel off.
#
# Webhooks: channels without buttons (alerts, join-leave, weekly-report, chat, staffchat, console)
# can post through a webhook instead of the bot. Create one in Discord under Channel settings >
# Integrations > Webhooks, copy its URL and paste it at "webhook". Webhook messages:
#   - also work when the bot is off (enabled: false) — only the discord module must be on
#   - keep coming while the bot reconnects, and don't count towards the bot's rate limits
#   - use the name and picture you give the webhook in Discord (chat shows each player's head)
# Messages from Discord to Minecraft (chat, staffchat, console commands) still need the bot and
# the channel ID. Keep webhook URLs secret: anyone with the URL can post in that channel.
channels:
  cases:
    enabled: true
    id: ""
  reports:
    enabled: true
    id: ""
  staffchat:
    enabled: true
    id: ""
    webhook: ""
  alerts:
    enabled: true
    id: ""
    webhook: ""
  join-leave:
    enabled: false
    id: ""
    webhook: ""
  appeals:
    enabled: true
    id: ""
  weekly-report:
    enabled: true
    id: ""
    webhook: ""
  # Public chat between Minecraft and Discord (see the chat section below).
  chat:
    enabled: false
    id: ""
    webhook: ""
  # Server console in Discord. Only give admins access to this channel (see the console section below).
  console:
    enabled: false
    id: ""
    webhook: ""

# ┌─────────────────────────────────────────────────────────┐
# │                      Staff Roles                        │
# └─────────────────────────────────────────────────────────┘

# Discord role IDs that may use the staff slash commands (/case, /history, /lookup, /health)
# and see staff buttons. /link, /unlink, /online and /appeal are available to everyone.
staff-roles: []
#  - "123456789012345678"

# Show staff command replies only to the user who ran them.
ephemeral-replies: true

# ┌─────────────────────────────────────────────────────────┐
# │                    Account Linking                      │
# └─────────────────────────────────────────────────────────┘

linking:
  # Kick players who haven't linked their Discord yet. They get their link code in the kick screen.
  # Bypass permission: Axentra.link.bypass
  require-link: false
  # Only allow one Discord account per Minecraft account, and the other way around.
  one-to-one: true
  # How long a /link code stays valid.
  code-minutes: 5
  # Remind players who haven't linked yet when they join, with a clickable button.
  join-reminder: true
  # Set the Discord nickname to the Minecraft name. The bot's role must be above the
  # member's highest role, and the server owner's nickname can never be changed.
  sync-nickname: false
  # Optional role ID that every linked member gets. Empty = none.
  linked-role: ""

# ┌─────────────────────────────────────────────────────────┐
# │                      Role Sync                          │
# └─────────────────────────────────────────────────────────┘

role-sync:
  enabled: false
  # MINECRAFT_TO_DISCORD - Minecraft permissions give Discord roles (recommended)
  # DISCORD_TO_MINECRAFT - Discord roles give Minecraft permissions
  # BOTH                 - both directions; roles are then only added from Minecraft, never removed
  # Note: Discord -> Minecraft can only grant permissions that Axentra itself adds while the
  # player is online. It cannot change groups in LuckPerms or other permission plugins.
  direction: MINECRAFT_TO_DISCORD
  # How often online players are synced (they are also synced on join and when linking).
  interval-minutes: 10
  # Remove synced roles when a player unlinks.
  remove-on-unlink: true
  # Map a name to a Discord role ID. A player with permission Axentra.discord.role.<name>
  # gets that role. Roles that are not listed here are never touched.
  roles: {}
  #  vip: "123456789012345678"
  #  staff: "234567890123456789"

# ┌─────────────────────────────────────────────────────────┐
# │                      Staff Chat                         │
# └─────────────────────────────────────────────────────────┘

staffchat:
  # Send in-game staff chat to Discord through a webhook with the player's head as avatar.
  # When false, the bot posts a normal message. Needs the "Manage Webhooks" permission.
  # Not used when channels.staffchat.webhook is set: that webhook is always used.
  use-webhook: true
  # Format for normal (non-webhook) messages sent to Discord. Placeholders: {player}, {message}
  to-discord-format: "**{player}**: {message}"
  # Format for Discord messages shown in-game. Only linked members with a staff role are relayed,
  # and the bot needs the MESSAGE CONTENT intent to read them.
  # Placeholders: {name} (Minecraft name), {discord} (Discord name), {message}
  to-minecraft-format: "&8[&9Discord&8] &e{name} &8» &f{message}"
  # React with ✅ on Discord messages that were shown in-game.
  confirm-reaction: false
  # Minecraft can't show images, so attachments from Discord become clickable links that open
  # in the browser. Placeholder for the hover text: {name} (file name)
  image-label: "&b[Image]"
  file-label: "&b[File]"
  attachment-hover: "&7Click to open &f{name}"

# ┌─────────────────────────────────────────────────────────┐
# │                      Public Chat                        │
# └─────────────────────────────────────────────────────────┘

# Minecraft chat <-> the "chat" channel. Muted players and staff chat are never sent to Discord.
# Discord -> Minecraft needs the MESSAGE CONTENT intent.
chat:
  # Post Minecraft chat through a webhook with each player's name and head.
  # Not used when channels.chat.webhook is set: that webhook is always used.
  use-webhook: true
  # Format without a webhook. Placeholders: {player}, {message}
  to-discord-format: "**{player}**: {message}"
  # Format in Minecraft. Placeholders: {name} (linked Minecraft name, else Discord name), {discord}, {message}
  to-minecraft-format: "&9[Discord] &f{name}&7: &f{message}"
  # Only relay Discord messages from members who linked their account.
  require-link: false
  # Allow bold, italics and links from Minecraft chat. Off = shown as typed, and nobody can post masked links.
  allow-markdown: false
  # Don't send chat of vanished staff to Discord.
  skip-vanished: true

# ┌─────────────────────────────────────────────────────────┐
# │                       Console                           │
# └─────────────────────────────────────────────────────────┘

# The server console in the "console" channel. Only admins should be able to see that channel:
# the console shows player names, plugin errors and everything else the server logs.
console:
  # Hide IP addresses in the console output.
  hide-ips: true
  # Send collected lines every this many seconds.
  flush-seconds: 3
  # Run console commands by typing them in the channel. Off by default — this gives full control
  # over the server, so only enable it if you trust everyone with a role below.
  allow-commands: false
  # Role IDs that may run commands. Separate from staff-roles on purpose.
  roles: []
  # Commands that can never be run from Discord, also with a prefix like minecraft:stop.
  blocked-commands:
    - stop
    - restart
    - reload
    - op
    - deop
    - lp
    - luckperms
    - pex

# ┌─────────────────────────────────────────────────────────┐
# │                        Reports                          │
# └─────────────────────────────────────────────────────────┘

reports:
  # Open a discussion thread under every report message. Needs "Create Public Threads".
  create-thread: true

# ┌─────────────────────────────────────────────────────────┐
# │                        Alerts                           │
# └─────────────────────────────────────────────────────────┘

# Which events are posted to the alerts channel.
alerts:
  alts: true
  vpn: true
  lag: true
  lag-recovered: true
  maintenance: true
  restarts: true

# ┌─────────────────────────────────────────────────────────┐
# │                      Join / Leave                       │
# └─────────────────────────────────────────────────────────┘

join-leave:
  # Joins and leaves within this many seconds are sent as one message.
  batch-seconds: 10
  # Show first joins separately.
  first-join: true

# ┌─────────────────────────────────────────────────────────┐
# │                      Ban Appeals                        │
# └─────────────────────────────────────────────────────────┘

appeals:
  enabled: true
  # Days before a player can appeal the same case again after a denial.
  cooldown-days: 7
  # Send the player a DM with the decision (ignored if their DMs are closed).
  dm-result: true
  # Role ID to ping in the appeals channel when a new appeal comes in. Empty = no ping.
  ping-role: ""
  # Questions in the appeal form (max 4). Each answer can be up to 1000 characters.
  questions:
    - "Why should you be unbanned?"
    - "What went wrong?"

# ┌─────────────────────────────────────────────────────────┐
# │                     Weekly Report                       │
# └─────────────────────────────────────────────────────────┘

weekly-report:
  enabled: true
  # MONDAY, TUESDAY, ... SUNDAY
  day: MONDAY
  # 24h time
  time: "09:00"
  # Timezone, e.g. Europe/Amsterdam or UTC
  timezone: "UTC"

# ┌─────────────────────────────────────────────────────────┐
# │                        Embeds                           │
# └─────────────────────────────────────────────────────────┘

embeds:
  # Colors in hex.
  colors:
    ban: "#E53935"
    tempban: "#E53935"
    mute: "#FB8C00"
    tempmute: "#FB8C00"
    warn: "#FDD835"
    kick: "#8E24AA"
    freeze: "#29B6F6"
    report: "#00BCD4"
    alert: "#FF7043"
    success: "#43A047"
    info: "#00BCD4"
    appeal: "#5C6BC0"
  # Footer on every embed. Placeholders: {server}
  footer: "Axentra • {server}"
  # Show player heads as thumbnails.
  thumbnails: true
  # Avatar service for player heads. Placeholders: {uuid}, {name}
  avatar-url: "https://mc-heads.net/avatar/{uuid}/64"
  # Link on player names. Placeholders: {uuid}, {name}. Empty = no link.
  profile-url: "https://namemc.com/profile/{uuid}"

