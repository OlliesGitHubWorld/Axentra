# ┌─────────────────────────────────────────────────────────┐
# │              Axentra Punishment Templates                │
# │                  Made by OlliesWorld                    │
# └─────────────────────────────────────────────────────────┘
#
#  These templates are shown in the /punish GUI.
#  Staff can click a template to apply it to a player.
#
#  Each template has:
#    display-name - The name shown in the GUI (supports & color codes)
#    action       - The punishment type: warn, kick, mute, tempmute, ban, tempban
#    reason       - The reason shown to the player
#    duration     - Required for tempban/tempmute (e.g. "1h", "7d", "30d")
#    icon         - The Minecraft material used as the GUI icon
#    escalation   - (optional) A list of steps for repeat offenses, e.g.
#                     escalation:
#                       - "warn"
#                       - "tempmute 1h"
#                       - "tempban 1d"
#                   The step is picked by counting the player's earlier cases with
#                   the SAME reason: 1st offense = step 1, 2nd = step 2, and so on.
#                   After the last step, the last step keeps being used.
#                   When escalation is set, action/duration are ignored.
#                   The GUI shows which step applies before you click.
#
# ══════════════════════════════════════════════════════════

templates:

  # ── Chat Offenses ──────────────────────────────────────
  spam:
    display-name: "&eSpam"
    action: warn
    reason: "Spamming in chat"
    icon: PAPER
    escalation:
      - "warn"
      - "warn"
      - "tempmute 30m"
      - "tempmute 2h"
      - "tempmute 1d"

  caps:
    display-name: "&eCaps Abuse"
    action: warn
    reason: "Excessive use of caps"
    icon: PAPER
    escalation:
      - "warn"
      - "warn"
      - "tempmute 30m"
      - "tempmute 2h"

  toxicity:
    display-name: "&6Toxicity"
    action: tempmute
    duration: "1h"
    reason: "Toxic behavior in chat"
    icon: ORANGE_DYE
    escalation:
      - "tempmute 1h"
      - "tempmute 6h"
      - "tempmute 1d"
      - "tempban 3d"

  advertising:
    display-name: "&cAdvertising"
    action: tempban
    duration: "7d"
    reason: "Advertising other servers"
    icon: RED_DYE
    escalation:
      - "tempban 7d"
      - "tempban 30d"
      - "ban"

  # ── Gameplay Offenses ──────────────────────────────────
  minor-grief:
    display-name: "&eMinor Grief"
    action: warn
    reason: "Minor griefing"
    icon: DIRT
    escalation:
      - "warn"
      - "tempban 1d"
      - "tempban 3d"
      - "tempban 7d"

  major-grief:
    display-name: "&cMajor Grief"
    action: tempban
    duration: "7d"
    reason: "Major griefing"
    icon: TNT
    escalation:
      - "tempban 7d"
      - "tempban 30d"
      - "ban"

  xray:
    display-name: "&cX-Ray"
    action: tempban
    duration: "30d"
    reason: "Using X-Ray or similar mods"
    icon: DIAMOND_ORE
    escalation:
      - "tempban 30d"
      - "ban"

  hacking:
    display-name: "&4Hacking"
    action: ban
    reason: "Using hacked client or exploits"
    icon: BARRIER

  # ── General ────────────────────────────────────────────
  inappropriate-name:
    display-name: "&6Inappropriate Name"
    action: kick
    reason: "Inappropriate username or nickname"
    icon: NAME_TAG

  inappropriate-skin:
    display-name: "&6Inappropriate Skin"
    action: kick
    reason: "Inappropriate player skin"
    icon: LEATHER_CHESTPLATE

  general-warn:
    display-name: "&eGeneral Warning"
    action: warn
    reason: "Breaking server rules"
    icon: YELLOW_DYE

  general-mute:
    display-name: "&6General Mute"
    action: tempmute
    duration: "30m"
    reason: "Breaking chat rules"
    icon: IRON_BARS
    escalation:
      - "tempmute 30m"
      - "tempmute 2h"
      - "tempmute 1d"
      - "tempmute 7d"

  general-tempban:
    display-name: "&cGeneral Temp Ban"
    action: tempban
    duration: "1d"
    reason: "Breaking server rules"
    icon: IRON_DOOR

  general-ban:
    display-name: "&4General Ban"
    action: ban
    reason: "Severe rule violation"
    icon: BEDROCK

# ┌─────────────────────────────────────────────────────────┐
# │                 Server Health (v1.8.0)                 │
# └─────────────────────────────────────────────────────────┘

  lag-machine-warn:
    display-name: "&eLag Machine Warning"
    action: warn
    reason: "Building a lag machine / excessive redstone"
    icon: REDSTONE
    escalation:
      - "warn"
      - "tempban 1d"
      - "tempban 3d"

  lag-machine-tempban:
    display-name: "&cLag Machine Temp Ban"
    action: tempban
    duration: "3d"
    reason: "Intentional lag machine — server performance impact"
    icon: OBSERVER

  lag-machine-ban:
    display-name: "&4Lag Machine Ban"
    action: ban
    reason: "Repeated lag machine offenses"
    icon: TNT

# ══════════════════════════════════════════════════════════
#                   End of Punishments
# ══════════════════════════════════════════════════════════
